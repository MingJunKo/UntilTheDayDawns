  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  const btn=document.getElementById('go'); btn.textContent='Opening…'; btn.disabled=true;
  try{ const html=await open_(pw);
    try{ if(remember) localStorage.setItem('utdd_study_pw',pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){ btn.textContent='Open the notes'; btn.disabled=false; document.getElementById('err').textContent='That password didn\'t work. Try again.'; try{localStorage.removeItem('utdd_study_pw')}catch(x){} }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value.trim(),document.getElementById('rem').checked);});
let saved=null; try{saved=localStorage.getItem('utdd_study_pw')}catch(e){}
if(saved) go(saved,true);
}
