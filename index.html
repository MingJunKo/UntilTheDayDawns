<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Until the Day Dawns · An 8-bit End Times Quest</title>
<meta name="description" content="An 8-bit RPG through the end times: from Babel to Babylon, Galilee to the throne of heaven and the dawn of Christ's return. Based on Ps Daniel Foo's End Times series.">
<meta property="og:title" content="Until the Day Dawns · An 8-bit End Times Quest">
<meta property="og:description" content="Walk with the angel Gabriel through the ages. Answer with the truth, put on the whole armour of God, and carry the light home.">
<meta property="og:image" content="https://mingjunko.github.io/UntilTheDayDawns/og.png">
<meta property="og:type" content="website">

<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0820; --ink2:#17123a; --gold:#f2c14e; --gold2:#b9852a; --cream:#fff4d6; --soft:#c9bfe6;
  --red:#e2574c; --green:#5fcf7a; --blue:#5aa9e6; --box:rgba(11,8,32,.94);
  --pix:'Press Start 2P', ui-monospace, monospace; --body:'Pixelify Sans', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--cream);overflow:hidden;touch-action:manipulation;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--body);}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:820px;margin:0 auto}
#stage{position:relative;width:100%;aspect-ratio:4/3;flex:none;background:#000;overflow:hidden;
  box-shadow:0 0 0 3px var(--ink2),0 0 0 5px var(--gold2)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#side{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
#panel{flex:1;min-height:0;position:relative;padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}

/* HUD on canvas */
#hud{position:absolute;left:6px;top:6px;right:6px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-family:var(--pix);font-size:9px;z-index:3}
#hud .chip{background:rgba(11,8,32,.75);border:2px solid var(--gold2);padding:5px 7px;border-radius:2px;pointer-events:auto;display:flex;gap:7px;align-items:center}
.hpbar{width:64px;height:7px;background:#3a2240;border:1px solid #000;position:relative}
.hpbar i{position:absolute;inset:0;width:100%;background:linear-gradient(#8ef09f,#3fae5a)}
#loc{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--pix);font-size:12px;color:var(--gold);
  text-shadow:2px 2px 0 #000;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none;z-index:3;line-height:1.7;width:90%}
#loc.show{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6;transition:opacity .5s}

/* Boxes */
.box{background:var(--box);border:3px solid var(--gold);border-radius:4px;box-shadow:inset 0 0 0 2px #000,0 4px 0 #000;padding:10px 12px}
#dlg{position:relative;font-size:18px;line-height:1.38;min-height:96px;cursor:pointer}
#dlg .who{font-family:var(--pix);font-size:10px;color:var(--gold);margin-bottom:6px;letter-spacing:.5px}
#dlg .txt em{color:#9fd6ff;font-style:normal}
#dlg .txt b{color:var(--gold);font-weight:600}
#dlg .ref{color:var(--soft);font-size:14px}
#dlg .more{position:absolute;right:10px;bottom:6px;font-size:12px;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hidden{display:none!important}

#status{font-size:15px;color:var(--soft);line-height:1.4}
#status .place{font-family:var(--pix);font-size:10px;color:var(--gold);margin-bottom:6px}
#status .goal{color:var(--cream)}
#status .goal:before{content:'► ';color:var(--gold)}

/* Option buttons */
.opts{display:grid;gap:7px}
.opt{text-align:left;background:#211a4a;border:2px solid #4a3f8a;border-radius:3px;padding:10px 12px;font-size:17px;line-height:1.25;color:var(--cream);box-shadow:0 3px 0 #000}
.opt:active,.opt.sel{background:#3b2f7a;border-color:var(--gold)}
.opt.right{background:#1e5a33;border-color:var(--green)}
.opt.wrong{background:#6a1f2b;border-color:var(--red)}
.opt[disabled]{opacity:.75}
.q{font-size:18px;line-height:1.35}
.q small{display:block;font-family:var(--pix);font-size:9px;color:var(--gold);margin-bottom:7px}
.explain{font-size:15px;color:var(--soft);line-height:1.35;border-left:3px solid var(--gold2);padding-left:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--pix);font-size:10px;background:var(--gold);color:var(--ink);border:none;border-radius:3px;padding:11px 14px;box-shadow:0 4px 0 var(--gold2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.btn.ghost{background:#2a2160;color:var(--cream);box-shadow:0 4px 0 #000}

/* Battle */
.bstats{display:flex;justify-content:space-between;gap:10px;font-family:var(--pix);font-size:9px;line-height:1.8}
.bstats .hpbar{width:100%;height:9px;margin-top:3px}
.bstats > div{flex:1}
.bmenu{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bmenu .opt{font-family:var(--pix);font-size:11px;text-align:center;padding:14px 6px}
.blog{font-size:17px;min-height:46px;line-height:1.35}
.timer{height:5px;background:#2a2160;margin-top:6px}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transition:width .1s linear}

/* Puzzle */
.slots{display:grid;gap:6px}
.slot{border:2px dashed #4a3f8a;border-radius:3px;padding:9px 10px;font-size:16px;min-height:40px;color:var(--soft);display:flex;gap:8px;align-items:center}
.slot.filled{border-style:solid;border-color:var(--gold);color:var(--cream);background:#211a4a}
.slot .n{font-family:var(--pix);font-size:9px;color:var(--gold)}
.sortcard{font-size:19px;text-align:center;padding:16px 10px;min-height:70px;display:flex;align-items:center;justify-content:center}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sortbtns .opt{text-align:center;font-family:var(--pix);font-size:10px;padding:16px 6px}

/* Menus */
.menu h3{font-family:var(--pix);font-size:11px;color:var(--gold);margin:4px 0 8px}
.menu .item{font-size:16px;line-height:1.35;padding:7px 0;border-bottom:1px solid #2a2160}
.menu .item b{color:var(--gold);font-weight:600}
.menu .dim{color:#6f6596}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs .btn{font-size:9px;padding:8px 10px}

/* Title / overlays on stage */
.over{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:12px}
.title1{font-family:var(--pix);font-size:clamp(14px,4.4vw,26px);color:var(--gold);text-shadow:3px 3px 0 #000,0 0 18px rgba(242,193,78,.5);line-height:1.5}
.title2{font-family:var(--pix);font-size:clamp(7px,1.8vw,10px);color:var(--cream);text-shadow:2px 2px 0 #000;letter-spacing:1px}
.caption{position:absolute;left:6%;right:6%;bottom:8%;text-align:center;font-size:clamp(15px,3.6vw,22px);line-height:1.35;color:#fff;
  text-shadow:2px 2px 0 #000,0 0 6px #000;z-index:4;pointer-events:none;transition:opacity .6s}
.caption .ref{display:block;font-family:var(--pix);font-size:clamp(7px,1.6vw,10px);color:var(--gold);margin-top:6px}
input.name{font-family:var(--pix);font-size:16px;background:#000;color:var(--gold);border:3px solid var(--gold);padding:10px;width:100%;max-width:300px;text-align:center;text-transform:uppercase;user-select:text;-webkit-user-select:text}

/* Pad */
#pad{flex:none;display:none;justify-content:space-between;align-items:center;padding:6px 18px 12px;width:100%;touch-action:none}
.touch #pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.pb{background:#2a2160;border:none;border-radius:8px;box-shadow:0 4px 0 #000,inset 0 0 0 2px #4a3f8a;color:var(--cream);font-size:20px;
  display:flex;align-items:center;justify-content:center;touch-action:none}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 0 0 2px var(--gold);background:#3b2f7a}
.pu{grid-column:2;grid-row:1}.pl{grid-column:1;grid-row:2}.pr{grid-column:3;grid-row:2}.pd{grid-column:2;grid-row:3}
.pc{grid-column:2;grid-row:2;background:transparent;box-shadow:none}
.ab{display:flex;gap:14px;align-items:center}
.ab .pb{width:66px;height:66px;border-radius:50%;font-family:var(--pix);font-size:14px}
.ab .pa{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold2);margin-top:-30px}
.ab .pa.on{box-shadow:0 1px 0 var(--gold2);background:#ffd978}
.pm{position:absolute;right:6px;top:6px;z-index:4;font-family:var(--pix);font-size:9px;padding:6px 8px}

@media (orientation:landscape) and (max-height:560px){
  #app{flex-direction:row;max-width:none;align-items:stretch}
  #stage{height:100%;width:auto;aspect-ratio:4/3}
  #side{min-width:0}
  #dlg{font-size:16px;min-height:0}
  .opt{font-size:15px;padding:8px 10px}
  .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .ab .pb{width:56px;height:56px}
}
@media (min-width:700px) and (pointer:fine){ #app{padding-top:16px} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="256" height="192"></canvas>
    <div id="hud" class="hidden">
      <div class="chip"><span id="hlv">LV1</span><div class="hpbar"><i id="hhp"></i></div><span id="hhpt">30</span></div>
      <div class="chip" id="hmenu" style="cursor:pointer">☰ MENU</div>
    </div>
    <div id="loc"></div>
    <div id="caption" class="caption"></div>
    <div id="over" class="over hidden"></div>
    <div id="fade"></div>
  </div>
  <div id="side">
    <div id="panel">
      <div id="status" class="box"></div>
      <div id="dlg" class="box hidden"><div class="who"></div><div class="txt"></div><div class="more">▼</div></div>
      <div id="ui" class="hidden"></div>
    </div>
    <div id="pad">
      <div class="dpad">
        <button class="pb pu" data-k="up">▲</button><button class="pb pl" data-k="left">◀</button>
        <div class="pc"></div>
        <button class="pb pr" data-k="right">▶</button><button class="pb pd" data-k="down">▼</button>
      </div>
      <div class="ab"><button class="pb pbb" data-k="b">B</button><button class="pb pa" data-k="a">A</button></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   UNTIL THE DAY DAWNS — an 8-bit quest through Ps Daniel Foo's End Times series
   Engine part 1: utilities, audio, pixel art
   ========================================================================= */
const $ = s => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const W = 256, H = 192, TS = 16, VW = 16, VH = 12;
cx.imageSmoothingEnabled = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('utdd_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('utdd_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ------------------------------------------------------------------ AUDIO */
const AU = {
  ctx: null, master: null, music: null, sfxG: null, muted: store.get('muted', false), track: null, timer: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.32; this.music.connect(this.master);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = 0.5; this.sfxG.connect(this.master);
      if (this.pending) this.play(this.pending);
    } catch (e) { }
  },
  setMute(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  freq(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n); if (!m) return 0; const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); return 440 * Math.pow(2, (base + (+m[3] + 1) * 12 - 69) / 12); },
  tone(f, t, d, type = 'square', vol = .2, dest, slide) {
    if (!this.ctx || !f) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.setValueAtTime(vol, t + Math.max(0.02, d * 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + d + 0.03);
  },
  noise(t, d, vol = .15, hp = 1000) {
    if (!this.ctx) return; const len = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < len; i++) a[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    s.buffer = b; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f); f.connect(g); g.connect(this.sfxG); s.start(t);
  },
  sfx(n) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    const S = {
      blip: () => this.tone(880, t, .03, 'square', .04),
      sel: () => { this.tone(660, t, .05, 'square', .1); this.tone(990, t + .05, .06, 'square', .1); },
      back: () => this.tone(330, t, .07, 'square', .1),
      step: () => this.tone(110, t, .03, 'triangle', .05),
      bump: () => this.tone(90, t, .08, 'square', .08),
      hit: () => { this.noise(t, .12, .3, 600); this.tone(220, t, .12, 'square', .15, null, 80); },
      crit: () => { this.noise(t, .2, .35, 300); this.tone(880, t, .25, 'sawtooth', .15, null, 110); },
      hurt: () => { this.tone(180, t, .2, 'sawtooth', .18, null, 60); this.noise(t, .15, .2, 200); },
      heal: () => [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * .07, .18, 'triangle', .2)),
      right: () => { this.tone(784, t, .08, 'square', .14); this.tone(1175, t + .08, .16, 'square', .14); },
      wrong: () => { this.tone(220, t, .14, 'square', .14); this.tone(165, t + .14, .22, 'square', .14); },
      chest: () => [392, 494, 587, 784, 988].forEach((f, i) => this.tone(f, t + i * .08, .2, 'square', .13)),
      fanfare: () => { [[523, 0], [523, .12], [523, .24], [659, .36], [784, .6], [659, .78], [784, .9]].forEach(([f, d]) => this.tone(f, t + d, .22, 'square', .14)); this.tone(1047, t + 1.05, .7, 'square', .14); },
      level: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, t + i * .06, .14, 'square', .12)),
      door: () => { this.tone(300, t, .1, 'triangle', .2); this.tone(450, t + .1, .15, 'triangle', .2); },
      trumpet: () => { [392, 523, 659, 784].forEach((f, i) => { this.tone(f, t + i * .35, .5, 'sawtooth', .12); this.tone(f * 2, t + i * .35, .5, 'square', .05); }); this.tone(1047, t + 1.45, 1.8, 'sawtooth', .14); this.tone(523, t + 1.45, 1.8, 'square', .08); },
      rumble: () => { this.noise(t, 1.4, .4, 40); this.tone(50, t, 1.4, 'sawtooth', .25, null, 30); },
      whoosh: () => this.noise(t, .5, .2, 1500),
      bell: () => [0, 1.1, 2.2].forEach(d => { this.tone(392, t + d, 1.2, 'triangle', .3); this.tone(784, t + d, .8, 'sine', .12); }),
      flee: () => [600, 500, 400, 300].forEach((f, i) => this.tone(f, t + i * .05, .06, 'square', .1)),
      fire: () => { this.noise(t, .6, .25, 300); }
    };
    S[n] && S[n]();
  },
  parse(s) { return s.trim().split(/\s+/).map(tok => { const [n, d] = tok.split(':'); return [n, +d || 4]; }); },
  play(name) {
    if (!this.ctx) { this.pending = name; return; }
    if (this.track === name) return; this.stop(); this.track = name; const T = TRACKS[name]; if (!T) return;
    const sp = 60 / T.bpm / 4, chans = T.ch.map(c => ({ notes: this.parse(c.n), i: 0, t: this.ctx.currentTime + .1, type: c.t, vol: c.v }));
    const tick = () => {
      const now = this.ctx.currentTime;
      for (const c of chans) {
        while (c.t < now + 0.25) {
          const [n, d] = c.notes[c.i]; const dur = d * sp;
          if (n !== 'R') { if (n === 'K') this.noiseTo(c.t, .05, c.vol); else this.tone(this.freq(n), c.t, dur * .92, c.type, c.vol, this.music); }
          c.t += dur; c.i = (c.i + 1) % c.notes.length;
        }
      }
    };
    tick(); this.timer = setInterval(tick, 90);
  },
  noiseTo(t, d, vol) { if (!this.ctx) return; const len = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), a = b.getChannelData(0); for (let i = 0; i < len; i++) a[i] = Math.random() * 2 - 1; const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); s.buffer = b; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(g); g.connect(this.music); s.start(t); },
  stop() { clearInterval(this.timer); this.timer = null; this.track = null; this.pending = null; }
};
/* Original chiptune loops. note:sixteenths. R=rest, K=noise hit */
const TRACKS = {
  title: { bpm: 84, ch: [
    { t: 'square', v: .09, n: 'E4:4 G4:4 C5:8 B4:4 A4:4 G4:8 A4:4 B4:4 C5:4 E5:4 D5:16 E5:4 D5:4 C5:8 A4:4 B4:4 C5:8 G4:4 A4:4 F4:4 D4:4 C4:16' },
    { t: 'triangle', v: .22, n: 'C3:8 G3:8 G2:8 D3:8 F2:8 C3:8 G2:8 D3:8 A2:8 E3:8 F2:8 C3:8 G2:8 B2:8 C3:16' },
    { t: 'square', v: .035, n: 'C5:2 E5:2 G5:2 E5:2 B4:2 D5:2 G5:2 D5:2 A4:2 C5:2 F5:2 C5:2 B4:2 D5:2 G5:2 D5:2 A4:2 C5:2 E5:2 C5:2 F4:2 A4:2 C5:2 A4:2 G4:2 B4:2 D5:2 B4:2 C5:2 E5:2 G5:2 E5:2' }] },
  night: { bpm: 72, ch: [

    const txt = dlg.querySelector('.txt'), html = fmt(line); const more = dlg.querySelector('.more'); more.style.visibility = 'hidden';

/* ------------------------------------------------------------------ MAP */

  const e = ENTS.find(e => e !== self && e.alive !== false && e.x === x && e.y === y && e.solid !== false && visible(e)); return !!e;
}

}

/* ----------------------------------------------------------- HERO MOVE */
const hero = { px: 0, py: 0, moving: false, fx: 0, fy: 0, tx: 0, ty: 0, t0: 0, step: 0 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function updateHero() {
  if (scene !== 'map') return;
  if (hero.moving) {
    const p = Math.min(1, (now - hero.t0) / 120);
    hero.px = (hero.fx + (hero.tx - hero.fx) * p) * TS; hero.py = (hero.fy + (hero.ty - hero.fy) * p) * TS;
    if (p >= 1) { hero.moving = false; S.x = hero.tx; S.y = hero.ty; hero.step++; onStep(); }
    return;
  }

  const k = ['up', 'down', 'left', 'right'].find(k => keys[k]); if (!k) return;
  S.dir = k; const [dx, dy] = DIRS[k], nx = S.x + dx, ny = S.y + dy;
  const e = ENTS.find(e => e.alive !== false && e.x === nx && e.y === ny && visible(e));
  if (e && e.t === 'foe') { keys[k] = false; startFoe(e); return; }
  if (blocked(nx, ny, 'hero')) { if (!hero.bumpT || now - hero.bumpT > 300) { hero.bumpT = now; } return; }
  hero.moving = true; hero.fx = S.x; hero.fy = S.y; hero.tx = nx; hero.ty = ny; hero.t0 = now;
}
async function onStep() {
  const t = tileAt(S.x, S.y);

}
async function runScript(fn) { if (!fn) return; busy++; try { await fn(); } catch (err) { console.error(err); } busy--; save(); hud(); if (!busy && scene === 'map') showStatus(); }

  }

/* --------------------------------------------------------------- ENEMIES */
function updateEnts() {
  if (scene !== 'map' || busy || focusList) return;
  for (const e of ENTS) {
    if (e.t !== 'foe' || e.alive === false || now < e.mt) continue;
    e.mt = now + rnd(650, 1300);
    const d = pick(['up', 'down', 'left', 'right']); const [dx, dy] = DIRS[d]; const nx = e.x + dx, ny = e.y + dy;
    if (Math.abs(nx - e.sx) > 3 || Math.abs(ny - e.sy) > 3) continue;
    if (nx === S.x && ny === S.y && !hero.moving) { startFoe(e); return; }
    if (!blocked(nx, ny, e) && !(nx === S.x && ny === S.y) && tileAt(nx, ny) !== 'D' && tileAt(nx, ny) !== 'A') { e.x = nx; e.y = ny; e.mx = now; e.pdx = dx; e.pdy = dy; }
  }
}

    if (e.pre) await e.pre();
    const r = await battle(e.kind, { boss: MONSTERS[e.kind].boss });
    if (r === 'win') { e.alive = false; if (e.id) S.done['k_' + e.id] = 1; if (e.post) await e.post(); }

}

/* ---------------------------------------------------------------- RENDER */
function cam() {
  const mw = GRID[0].length * TS, mh = GRID.length * TS;
  let x = hero.px + 8 - W / 2, y = hero.py + 8 - H / 2;
  x = mw <= W ? (mw - W) / 2 : clamp(x, 0, mw - W); y = mh <= H ? (mh - H) / 2 : clamp(y, 0, mh - H);

}
function drawMap() {

  for (let y = y0; y < Math.min(GRID.length, y0 + VH + 2); y++) for (let x = x0; x < Math.min(GRID[0].length, x0 + VW + 2); x++) {
    const ch = GRID[y][x], T = TILE[ch] || TILE['.']; const v = Math.floor(hash(x, y) * 7) + (ch === 'S' || ch === 'h' || ch === 'n' ? x * 31 + y : 0);

  }

  list.push({ hero: 1, y: hero.py / TS });
  list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e.hero) { const f = hero.moving ? (Math.floor(now / 110) % 2) : 0; drawSpr(person(heroLook(), S.dir, f), hero.px - ox, hero.py - oy - 2); continue; }
    let px = e.x * TS - ox, py = e.y * TS - oy;
    if (e.mx && now - e.mx < 200) { const p = (now - e.mx) / 200; px -= e.pdx * TS * (1 - p); py -= e.pdy * TS * (1 - p); }
    if (e.t === 'foe' || e.kind) { const M = MONSTERS[e.kind]; const big = M.boss; const img = monster(e.kind, Math.floor(now / 300) % 2); if (big) cx.drawImage(img, px - 8, py - 18, 32, 32); else drawSpr(img, px, py + Math.sin(now / 200 + e.sx) * 1.5 - 2); continue; }

    if (e.t === 'sign') { drawSign(px, py); continue; }
    if (e.t === 'glow') { drawGlow(px, py, e.col); continue; }

      let img = person(e.look, e.dir || 'down', e.walk ? Math.floor(now / 250) % 2 : 0);

    }

}
function drawSpr(img, x, y) { cx.drawImage(img, Math.round(x), Math.round(y)); }
function drawChest(x, y, open) { cx.fillStyle = '#120c22'; cx.fillRect(x + 1, y + 4, 14, 11); cx.fillStyle = open ? '#5a3a1e' : '#a8743f'; cx.fillRect(x + 2, y + 5, 12, 9); cx.fillStyle = '#ffd23f'; cx.fillRect(x + 2, y + 8, 12, 1); cx.fillRect(x + 7, y + 7, 2, 3); if (!open && frame % 40 < 20) { cx.fillStyle = '#fff'; cx.fillRect(x + 12, y + 3, 1, 1); } }
function drawSign(x, y) { cx.fillStyle = '#120c22'; cx.fillRect(x + 2, y + 2, 12, 9); cx.fillRect(x + 7, y + 10, 2, 6); cx.fillStyle = '#c9a46a'; cx.fillRect(x + 3, y + 3, 10, 7); cx.fillStyle = '#8a5a2b'; cx.fillRect(x + 4, y + 5, 8, 1); cx.fillRect(x + 4, y + 7, 6, 1); cx.fillStyle = '#6b3e26'; cx.fillRect(x + 7, y + 11, 2, 5); }

function loop(t) {
  now = t; frame++;
  updateHero(); updateEnts();
  cx.save();
  if (now < shakeT) cx.translate(Math.round(rnd(-3, 3)), Math.round(rnd(-3, 3)));
  if (customDraw) customDraw(t); else if (scene === 'map' && MAP) drawMap(); else { cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); }
  cx.restore();
  if (flashA > 0) { cx.globalAlpha = flashA; cx.fillStyle = flashCol; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; flashA = Math.max(0, flashA - 0.04); }
  requestAnimationFrame(loop);

/* ---------------------------------------------------------------- BATTLE */
const BG = {
  night: ['#0b0820', '#2a1f5a', '#1a1438'], field: ['#7ec8ff', '#d8f0ff', '#5aa64f'], desert: ['#f7b267', '#ffe0a3', '#d8b06a'], babylon: ['#5a2d7a', '#e07a5f', '#b8864a'],
  galilee: ['#9ad1ff', '#f2f8ff', '#6fb05f'], city: ['#1b2a4a', '#6a4a7a', '#7a7a8a'], midnight: ['#05040f', '#1a1438', '#3a3a52'], dawn: ['#2a1f5a', '#ff9f6b', '#7a8a6a']
};
let B = null; // battle visual state
function drawBattle() {
  const [a, b, gnd] = BG[B.bg] || BG.field; const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(.62, b); g.addColorStop(.62, gnd); g.addColorStop(1, shade(gnd, -.35)); cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  const sc = B.boss ? 6 : 4, img = monster(B.kind, Math.floor(now / 350) % 2), sz = 16 * sc;
  let ex = 160 - sz / 2 + (now < B.hitT ? rnd(-4, 4) : 0), ey = 128 - sz + Math.sin(now / 400) * 3;
  if (B.dying) { cx.globalAlpha = Math.max(0, 1 - (now - B.dying) / 700); ey -= (now - B.dying) / 30; }
  if (!(now < B.hitT && Math.floor(now / 60) % 2)) cx.drawImage(img, ex, ey, sz, sz);
  cx.globalAlpha = 1;
  // hero
  const hl = heroLook(); cx.drawImage(person(hl, 'up', Math.floor(now / 500) % 2), 50, 128, 32, 32);

   Engine part 3: cutscenes, Petra run, title, boot

const STARS = Array.from({ length: 90 }, (_, i) => ({ x: hash(i, 1) * W, y: hash(i, 2) * H, z: .3 + hash(i, 3) * .7 }));
let CS = { t0: 0, ph: 0, pt: 0, i: 0 };
function cutStart(fn, music) { statusBox.classList.add('hidden'); ui.classList.remove('hidden'); ui.innerHTML = '<div class="box" style="text-align:center;font-family:var(--pix);font-size:10px;color:var(--gold)">▶ TAP OR PRESS A TO CONTINUE</div>'; scene = 'cut'; CS = { t0: now, ph: 0, pt: now, i: 0 }; customDraw = fn; if (music) AU.play(music); }
function cutPhase(p) { CS.ph = p; CS.pt = now; }
function cutEnd() { customDraw = null; scene = 'map'; cap(''); clearUI(); }
function sky(c1, c2, c3) { const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(.7, c2); g.addColorStop(1, c3 || c2); cx.fillStyle = g; cx.fillRect(0, 0, W, H); }
function stars(alpha = 1, dy = 0) { for (const s of STARS) { const y = (s.y + dy * s.z) % H; cx.globalAlpha = alpha * (.4 + .6 * Math.abs(Math.sin(now / 700 + s.x))); cx.fillStyle = '#fff'; cx.fillRect(s.x, y < 0 ? y + H : y, s.z > .8 ? 2 : 1, s.z > .8 ? 2 : 1); } cx.globalAlpha = 1; }
function skyline(y, col, seed = 1) { cx.fillStyle = col; let x = 0, i = 0; while (x < W) { const w = 14 + hash(i, seed) * 22, h = 18 + hash(seed, i) * 46; cx.fillRect(x, y - h, w, h + 60); if (col !== '#000') for (let k = 0; k < 6; k++) if (hash(i, k + seed) > .55) { cx.fillStyle = '#ffd773'; cx.fillRect(x + 3 + (k % 3) * 4, y - h + 6 + Math.floor(k / 3) * 8, 2, 3); cx.fillStyle = col; } x += w + 2; i++; } }
function hills(y, col, amp = 14, f = .03, seed = 0) { cx.fillStyle = col; cx.beginPath(); cx.moveTo(0, H); for (let x = 0; x <= W; x += 4) cx.lineTo(x, y - Math.sin(x * f + seed) * amp - Math.sin(x * f * 2.3 + seed) * amp * .4); cx.lineTo(W, H); cx.fill(); }
function glowAt(x, y, r, col, a = 1) { const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)'); cx.globalAlpha = a; cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2); cx.globalAlpha = 1; }

/* ---- The rapture */
function drawRapture() {
  const e = (now - CS.pt) / 1000;
  if (CS.ph === 0) { sky('#05040f', '#1a1438', '#2a2440'); stars(1); skyline(170, '#141022', 3); cx.drawImage(person(heroLook(), 'down', 0), 120, 150); return; }
  if (CS.ph === 1) { sky('#0b0820', '#2a1f5a'); stars(1, e * 40); glowAt(128, 0, 200 * Math.min(1, e / 2), '#fff8dd', .7); for (let i = 0; i < 6; i++) { cx.globalAlpha = .15; cx.fillStyle = '#fff4c7'; const x = 128 + Math.sin(i * 1.7 + e) * 90; cx.beginPath(); cx.moveTo(x - 6, 0); cx.lineTo(x + 6, 0); cx.lineTo(x + 30, H); cx.lineTo(x - 30, H); cx.fill(); } cx.globalAlpha = 1; skyline(170 + e * 10, '#141022', 3); cx.drawImage(person(heroLook(), 'up', 0), 120, 150 - e * 4); return; }
  // ph 2: rising
  const sp = Math.min(e * 260, 900); sky('#140f3a', '#3a2f7a', '#7a6ac9');
  for (const s of STARS) { const y = (s.y + sp * s.z * e * .25) % H; cx.fillStyle = '#fff'; cx.globalAlpha = .8; cx.fillRect(s.x, y, 1, 4 + s.z * 10 * Math.min(1, e)); } cx.globalAlpha = 1;
  skyline(170 + e * 70, '#141022', 3);
  const hy = Math.max(60, 150 - e * 30);
  glowAt(128, hy + 8, 30 + e * 8, '#fff4c7', .9); cx.drawImage(person(heroLook(), 'up', 0), 120, hy);
  for (let i = 0; i < 14; i++) { const k = (i * 53 + e * 60) % 200; glowAt(20 + (i * 71) % 220, 200 - k, 5, '#fff4c7', .8); }
  if (e > 3) { cx.globalAlpha = Math.min(1, (e - 3) / 1.5); cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
}

  const L = [$('#fin1'), $('#fin2')]; L.cols = 2; setFocus(L, 0); busy--;
}

/* ------------------------------------------------------------------ BOOT */
window.addEventListener('pointerdown', () => AU.init(), { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx) AU.ctx.resume(); });
requestAnimationFrame(loop);
titleScreen();
</script>
